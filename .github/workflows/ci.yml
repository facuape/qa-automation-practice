name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Verificar que el README existe
        run: |
          echo "Buscando README.md..."
          test -f README.md
          echo "Todo bien, el archivo existe."